version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: graduation_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-graduation_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graduation_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graduation_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-graduation_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_graduation_jwt_key_2026_change_in_production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    networks:
      - graduation_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: graduation_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - graduation_network

  nginx:
    image: nginx:alpine
    container_name: graduation_nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - graduation_network

volumes:
  postgres_data:
    driver: local

networks:
  graduation_network:
    driver: bridge
